<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>GameRun • Página Oficial</title>

  <style>
    body {
      margin:0px;
      background-color: #170C14;
      color: #CCFFEE;
      font-family: Arial, Helvetica;
    }
    header {
      margin: 0px;
      text-align: center;
      background-color: #3D1225;
      text-decoration: solid;
      color: #612fff;
      padding: 10px 5px;
      border-bottom: 4px solid #eb0095;
      font-family: Courier New, Courier;
    }
    nav {
      background-color: #170C14;
      padding: 12px; 
      border-radius: 8px; 
      display: inline-block; 
      border: 1px solid #eb0095;
    }
    a {
      font-size: 16px;
      font-weight: bold;
      text-decoration:double;
      color: #eb0095
    }
    #sobre {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
  }
    .capa_de_jogos {
      display:flex;
      background-color: #3D1225;
      border: 2px solid#eb0095;
      border-radius: 20px;
    }
    .trailers {
      text-align: center;
      margin: 32px;

    }
    figure {
      border: 2px solid #170C14;
      border-radius: 10px;
      padding-bottom: 5px;
      font-weight: bold;
      font-family: 'Times New Roman', Times, serif;
    }
    img {
      border-radius: 8px;
    }
    aside {
      margin-left: 30%;
      margin-right: 30%;
      text-align: center;
      border: 3px solid #612fff;
      background-color: #3D1225;
      padding: 3px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <!-- ====================================================================
       TOPO & MENU (Com ID para ancoragem e Seletor #topo)
       ==================================================================== -->
  <header #topo>
    <div>
      <h1>GameRun</h1>
      <p>A loja oficial do mundo que está sempre em correria</p>

      <nav>
        <!-- Links internos usando ancoragem por ID (#secao) -->
        <a href="#sobre">Sobre - </a>
        <a href="#bestsellers">Mais Vendidos - </a>
        <a href="#contatos">Contato</a>
      </nav>
    </div>
  </header>

  <!-- ====================================================================
       CONTEÚDO PRINCIPAL (Centralizado na .container)
       ==================================================================== -->
  <main>

    <!-- Seção 1: Apresentação -->
    <section id="sobre">
      <h2>Bem vindo ao GameRun!</h2>
      <p>A casa dos games que não param.</p>
      <div class="capa_de_jogos">
        <figure>
          <img src="assets/images/zelda cover.jpg" alt="Imagem de cover de The Legend of Zelda: Ocarina of Time para o Switch 2" width="350" height="200">
          <figcaption>The Legend of Zelda: Ocarina of Time</figcaption>
        </figure>
        <figure>
          <img src="assets/images/windswaves_bnr.png" alt="Imagem de título de Pokémon: Winds e Pokémon: Waves para o Switch 2" width="350" height="200">
          <figcaption>Pokémon: Winds/Pokémon: Waves</figcaption>
        </figure>
        <figure>
          <img src="assets/images/p4r cover.jpg" alt="Imagem de cover de Persona 4 Revival" width="350" height="200">
          <figcaption>Persona 4 Revival</figcaption>
        </figure>
      </div>
    </section>

    <!-- Seção 2: Cards de Produtos/Serviços -->
    <section id="bestsellers">
      <div class="trailers">
        <h2>Trailers novos:</h2>
        <video controls poster="assets/images/zelda cover.jpg" preload="metadata" width="720">
          <source src="assets/midia/zeldatrailer.mp4" type="video/mp4">
        </video>
      </div>
      <article>

      </article>
    </section>

    <!-- Seção 3: RECURSO MANDATÓRIO (Pelo menos 1 dos 3 recursos abaixo) -->
    <section id="contato">
      <form action="#">

      </form>
    </section>

    <!-- Destaque / Promoção com <aside> -->
    <aside>
      <p>Promoção Inédita!</p>
    </aside>

  </main>

  <!-- Rodapé -->
  <footer>

  </footer>

</body>

</html>
